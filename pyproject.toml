[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fully01-retrieval_funnel_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列知识图谱构建工程师·检索召回的漏斗分析的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fully01" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fully01.github.io"
Repository = "https://github.com/fully01/retrieval_funnel_timeline_score"
Issues = "https://github.com/fully01/retrieval_funnel_timeline_score/issues"

[project.scripts]
retrieval_funnel_timeline_score = "retrieval_funnel_timeline_score:main"

[tool.setuptools]
py-modules = ["retrieval_funnel_timeline_score"]
